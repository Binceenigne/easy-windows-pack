<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>easy-windows-pack demo</title>
    <link rel="stylesheet" href="../frontend/window-frame.css">
    <style>
        html, body { height: 100%; margin: 0; }
        body { font: 15px/1.5 system-ui, sans-serif; }
        .demo-content { padding: 32px; }
        .demo-content h1 { margin-top: 0; }
        .demo-content button, .demo-content select { padding: 8px 10px; }
        .demo-status { color: #475569; }
    </style>
</head>
<body>
    <div id="easyWindowsPackFrame" class="ewp-window-frame" data-ewp-window-frame data-titlebar-mode="default">
        <header class="ewp-titlebar" data-ewp-drag-handle>
            <div class="ewp-titlebar-identity">
                <span data-ewp-title>easy-windows-pack demo</span>
            </div>
            <div class="ewp-window-controls" role="group" aria-label="Window controls">
                <button type="button" class="ewp-window-control" data-ewp-action="minimize" title="Minimize" aria-label="Minimize"><span class="ewp-control-glyph ewp-glyph-minimize" aria-hidden="true"></span></button>
                <button type="button" class="ewp-window-control" data-ewp-action="maximize" title="Maximize" aria-label="Maximize"><span class="ewp-control-glyph ewp-glyph-maximize" data-ewp-maximize-glyph aria-hidden="true"></span></button>
                <button type="button" class="ewp-window-control ewp-window-control-close" data-ewp-action="close" title="Close" aria-label="Close"><span class="ewp-control-glyph ewp-glyph-close" aria-hidden="true"></span></button>
            </div>
        </header>
        <span class="ewp-resize-handle ewp-resize-left" data-ewp-resize="left" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-right" data-ewp-resize="right" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-top" data-ewp-resize="top" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-bottom" data-ewp-resize="bottom" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-top-left" data-ewp-resize="top-left" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-top-right" data-ewp-resize="top-right" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-bottom-left" data-ewp-resize="bottom-left" aria-hidden="true"></span>
        <span class="ewp-resize-handle ewp-resize-bottom-right" data-ewp-resize="bottom-right" aria-hidden="true"></span>
        <main class="ewp-content" data-ewp-content>
            <div class="demo-content">
                <h1>Reusable WebView window</h1>
                <p>Use the native frame for a system title bar, or choose a custom frame for full control.</p>
                <label>Title bar mode <select id="mode"><option value="default">Default</option><option value="minimal">Minimal</option><option value="native">Native</option></select></label>
                <button id="apply" type="button">Apply mode</button>
                <p class="demo-status" id="status">Ready</p>
            </div>
        </main>
    </div>
    <script src="../frontend/window-frame.js"></script>
    <script>
        const status = document.getElementById('status');
        document.getElementById('apply').addEventListener('click', async () => {
            const result = await window.easyWindowsPack.setTitleBarMode(document.getElementById('mode').value);
            status.textContent = result.restartRequired
                ? 'Native mode requires recreating the pywebview window.'
                : result.ok ? `Mode: ${result.activeTitleBarMode}` : result.error;
        });
    </script>
</body>
</html>
