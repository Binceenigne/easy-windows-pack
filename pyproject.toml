[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-windows-pack"
version = "0.3.0"
description = "Reusable pywebview Windows title bar and native window controls"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pywebview>=5.4,<7"]

[project.optional-dependencies]
tray = ["pystray>=0.19.5,<0.20", "Pillow>=10"]
dev = ["build>=1.2", "wheel>=0.43", "setuptools>=68", "pyinstaller==6.22.2; sys_platform == 'win32'"]

[project.scripts]
easy-windows-pack = "easy_windows_pack.cli:main"

[tool.setuptools]
packages = ["easy_windows_pack"]
package-dir = { "" = "backend/base", easy_windows_pack = "backend/base/ewpcore" }

[tool.setuptools.data-files]
"share/easy-windows-pack/frontend/frame/ewpframe" = ["frontend/frame/ewpframe/*.js"]
"share/easy-windows-pack/frontend/components/titlebar" = ["frontend/components/titlebar/*.html", "frontend/components/titlebar/*.css"]
"share/easy-windows-pack/frontend/components/desktop" = ["frontend/components/desktop/*.js", "frontend/components/desktop/*.css"]
"share/easy-windows-pack/frontend/contracts" = ["frontend/contracts/*.json", "frontend/contracts/*.md", "frontend/contracts/*.ts"]
