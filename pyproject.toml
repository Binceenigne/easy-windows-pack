[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-windows-pack"
version = "0.1.0"
description = "Reusable pywebview Windows title bar and native window controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywebview>=5.4,<7"]

[tool.setuptools.packages.find]
include = ["easy_windows_pack*"]
