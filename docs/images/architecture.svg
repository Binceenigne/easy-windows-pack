<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">easy-windows-pack architecture</title>
  <desc id="desc">A bilingual diagram showing browser controls connected to the Python API and Win32 window controller.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Segoe UI', sans-serif; fill: #0f172a; }
      .text { font: 15px 'Segoe UI', sans-serif; fill: #334155; }
      .small { font: 13px 'Segoe UI', sans-serif; fill: #475569; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">easy-windows-pack · 窗口框架 / Window frame</text>

  <rect x="65" y="125" width="300" height="250" class="box" fill="url(#blue)"/>
  <text x="215" y="170" text-anchor="middle" class="label">WebView 前端 / Frontend</text>
  <text x="215" y="205" text-anchor="middle" class="text">window-frame.html</text>
  <text x="215" y="232" text-anchor="middle" class="text">window-frame.css</text>
  <text x="215" y="259" text-anchor="middle" class="text">window-frame.js</text>
  <text x="215" y="310" text-anchor="middle" class="small">三按钮 · 标题栏模式</text>
  <text x="215" y="334" text-anchor="middle" class="small">拖拽句柄 · 状态同步</text>

  <rect x="450" y="125" width="300" height="250" class="box" fill="url(#green)"/>
  <text x="600" y="170" text-anchor="middle" class="label">Python API / Controller</text>
  <text x="600" y="205" text-anchor="middle" class="text">WindowApi</text>
  <text x="600" y="232" text-anchor="middle" class="text">WindowController</text>
  <text x="600" y="259" text-anchor="middle" class="text">WindowConfig</text>
  <text x="600" y="310" text-anchor="middle" class="small">业务 API delegate</text>
  <text x="600" y="334" text-anchor="middle" class="small">测试 · 构建 · 生命周期</text>

  <rect x="835" y="125" width="300" height="250" class="box" fill="url(#amber)"/>
  <text x="985" y="170" text-anchor="middle" class="label">Windows 原生层 / Native</text>
  <text x="985" y="205" text-anchor="middle" class="text">Win32 non-client drag</text>
  <text x="985" y="232" text-anchor="middle" class="text">Aero Snap / Snap Layouts</text>
  <text x="985" y="259" text-anchor="middle" class="text">8-way resize</text>
  <text x="985" y="310" text-anchor="middle" class="small">最大化 · 还原 · 置顶</text>
  <text x="985" y="334" text-anchor="middle" class="small">Minimize · Close</text>

  <path d="M365 250 H450" class="line"/>
  <path d="M750 250 H835" class="line"/>
  <text x="408" y="235" text-anchor="middle" class="small">pywebview API</text>
  <text x="792" y="235" text-anchor="middle" class="small">ctypes / Win32</text>

  <rect x="250" y="425" width="700" height="48" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="455" text-anchor="middle" class="text">同一套窗口行为，可复用于不同 WebView 桌面应用 / Reuse the same window behavior across apps</text>
</svg>
