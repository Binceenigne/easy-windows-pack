<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">easy-windows-pack build flow</title>
  <desc id="desc">build.cmd invokes scripts/dev.py: full build runs tests, wheel, single-file EXE and source bundle sequentially. Artifacts use output categories, logs use output/logs, and PyInstaller caches use build. Progress counts completed stages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 25px 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Segoe UI', sans-serif; fill: #0f172a; }
      .text { font: 14px 'Segoe UI', sans-serif; fill: #334155; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">构建流程 / Build flow</text>
  <text x="600" y="78" text-anchor="middle" class="text">完整构建 / Full build · Windows · test → wheel → exe → bundle</text>
  <rect x="30" y="115" width="200" height="125" class="box" fill="#eff6ff"/>
  <text x="130" y="150" text-anchor="middle" class="label">build.cmd build</text>
  <text x="130" y="180" text-anchor="middle" class="text">scripts/dev.py</text>
  <text x="130" y="212" text-anchor="middle" class="text">先初始化 / init first</text>
  <rect x="265" y="115" width="200" height="125" class="box" fill="#ecfdf5"/>
  <text x="365" y="150" text-anchor="middle" class="label">1 · Tests</text>
  <text x="365" y="180" text-anchor="middle" class="text">unittest discover</text>
  <text x="365" y="212" text-anchor="middle" class="text">失败即停 / Stop on error</text>
  <rect x="500" y="115" width="200" height="125" class="box" fill="#fffbeb"/>
  <text x="600" y="150" text-anchor="middle" class="label">2 · Python wheel</text>
  <text x="600" y="180" text-anchor="middle" class="text">output/wheels/</text>
  <text x="600" y="212" text-anchor="middle" class="text">pip installable</text>
  <rect x="735" y="115" width="200" height="125" class="box" fill="#f5f3ff"/>
  <text x="835" y="150" text-anchor="middle" class="label">3 · Windows EXE</text>
  <text x="835" y="180" text-anchor="middle" class="text">output/exe/</text>
  <text x="835" y="212" text-anchor="middle" class="text">PyInstaller · single file</text>
  <rect x="970" y="115" width="200" height="125" class="box" fill="#fef2f2"/>
  <text x="1070" y="150" text-anchor="middle" class="label">4 · Source bundle</text>
  <text x="1070" y="180" text-anchor="middle" class="text">output/bundles/</text>
  <text x="1070" y="212" text-anchor="middle" class="text">backend + frontend + docs</text>
  <path d="M230 178 H265" class="line"/>
  <path d="M465 178 H500" class="line"/>
  <path d="M700 178 H735" class="line"/>
  <path d="M935 178 H970" class="line"/>
  <text x="600" y="277" text-anchor="middle" class="text">阶段进度 / Completed stages · 日志 / Logs: output/logs/</text>
  <text x="600" y="306" text-anchor="middle" class="text">PyInstaller: build/spec/ + build/pyinstaller/ · CLI / build.ps1: test + wheel + bundle</text>
</svg>
